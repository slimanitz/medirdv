{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medirdv-web
  labels:
    {{- include "medirdv.labels" . | nindent 4 }}
    app.kubernetes.io/name: medirdv-web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: medirdv-web
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medirdv-web
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        # nginx-unprivileged image user
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: web
          image: {{ include "medirdv.image" (dict "root" . "name" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KEYCLOAK_URL
              value: {{ include "medirdv.keycloakUrl" . | quote }}
            - name: API_URL
              value: {{ .Values.web.apiUrl | default "/api" | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.web.containerPort | default 8080 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /config.json
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            {{- include "medirdv.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: medirdv-web
  labels:
    {{- include "medirdv.labels" . | nindent 4 }}
    app.kubernetes.io/name: medirdv-web
spec:
  selector:
    app.kubernetes.io/name: medirdv-web
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http
{{- end }}
