{{- if .Values.external.database.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.external.database.existingSecret }}
  labels:
    {{- include "medirdv.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.external.database.username | quote }}
  password: {{ required "external.database.password is required when external.database.createSecret=true" .Values.external.database.password | quote }}
{{- end }}
