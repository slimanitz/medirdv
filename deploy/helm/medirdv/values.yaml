# Images are published to GHCR by the CI workflow (tags: git sha and latest).
image:
  registry: ghcr.io/slimanitz
  # Empty = the chart appVersion (CI also tags images with it). Override with a git sha for CD.
  tag: ""
  pullPolicy: IfNotPresent

# Kafka, PostgreSQL and Keycloak are NOT deployed by this chart. Suggested charts:
#   bitnami/kafka (KRaft), bitnami/postgresql (one release or one database per service),
#   bitnami/keycloak or the Keycloak operator. See README "Kubernetes".
external:
  kafkaBootstrapServers: kafka.medirdv-infra.svc.cluster.local:9092
  # Replication factor of the topics created by the services (use 3 on a real cluster).
  kafkaReplicationFactor: 1
  keycloak:
    # Issuer seen by browsers (validated in the "iss" claim).
    issuerUri: https://auth.medirdv.example.fr/realms/medirdv
    # Keys fetched through the cluster network.
    jwkSetUri: http://keycloak.medirdv-infra.svc.cluster.local/realms/medirdv/protocol/openid-connect/certs
  database:
    # Secret with "username" and "password" keys, shared by the three services.
    existingSecret: medirdv-db
    # Set to true to let the chart create the secret (demo clusters only); then
    # external.database.password is required (--set external.database.password=...).
    createSecret: false
    username: medirdv
    password: ""

tracing:
  exportEnabled: false
  otlpEndpoint: http://tempo.observability.svc.cluster.local:4318/v1/traces

# Loads the fictitious demo data set (Spring profile "demo"). Never enable in production.
demoData: false

# Defaults applied to every Java service.
# Actuator listens on services.<name>.managementPort (default: port + 1000), used by probes and
# Prometheus only. Outbox publication is serialised by a PostgreSQL advisory lock, so services
# with an outbox can scale out without breaking per-aggregate event ordering (ADR 0002).
serviceDefaults:
  replicas: 2
  javaToolOptions: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      memory: 640Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

services:
  gateway:
    enabled: true
    port: 8200
    env:
      PATIENT_SERVICE_URL: http://medirdv-patient-service:8201
      SCHEDULING_SERVICE_URL: http://medirdv-scheduling-service:8202
      NOTIFICATION_SERVICE_URL: http://medirdv-notification-service:8203
      CORS_ALLOWED_ORIGINS: https://medirdv.example.fr
  patient-service:
    enabled: true
    port: 8201
    database:
      url: jdbc:postgresql://postgresql.medirdv-infra.svc.cluster.local:5432/patients
    env: {}
  scheduling-service:
    enabled: true
    port: 8202
    database:
      url: jdbc:postgresql://postgresql.medirdv-infra.svc.cluster.local:5432/scheduling
    env:
      SAGA_VALIDATION_TIMEOUT: PT2M
  notification-service:
    enabled: true
    port: 8203
    database:
      url: jdbc:postgresql://postgresql.medirdv-infra.svc.cluster.local:5432/notifications
    env: {}

web:
  enabled: true
  replicas: 2
  # Service port; the unprivileged nginx container listens on containerPort.
  port: 80
  containerPort: 8080
  # Keycloak URL seen by browsers, written to /config.json at start.
  # Empty = external.keycloak.issuerUri without "/realms/<realm>".
  keycloakUrl: ""
  apiUrl: /api
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 64Mi

ingress:
  enabled: true
  className: nginx
  host: medirdv.example.fr
  annotations: {}
  tls:
    enabled: false
    secretName: medirdv-tls
