global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: medirdv
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          # management ports (actuator is not served on the application ports)
          - gateway:9200
          - patient-service:9201
          - scheduling-service:9202
          - notification-service:9203
