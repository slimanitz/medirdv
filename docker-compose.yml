# MediRDV — whole product on one machine.
#   docker compose up -d --build                          core stack
#   TRACING_EXPORT_ENABLED=true docker compose --profile observability up -d --build
# Host ports are in the 8200-8299 / 9290 / 5434-5436 / 3200-3201 range reserved for this project.
# Actuator (health, Prometheus) listens on management ports 9200-9203 inside the network only:
# they are not published; Prometheus (observability profile) scrapes them from the network.
name: medirdv

x-service-env: &service-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  DB_USER: ${POSTGRES_USER:-medirdv}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-medirdv}
  # Tokens are issued to the browser by http://localhost:8280 (external issuer),
  # signing keys are fetched from Keycloak over the internal network.
  JWT_ISSUER_URI: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:8280}/realms/medirdv
  JWT_JWK_SET_URI: http://keycloak:8080/realms/medirdv/protocol/openid-connect/certs
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
  TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
  SAGA_VALIDATION_TIMEOUT: ${SAGA_VALIDATION_TIMEOUT:-PT2M}

x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 20

x-java-healthcheck: &java-healthcheck
  interval: 10s
  timeout: 3s
  retries: 30
  start_period: 20s

services:
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9292
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9292
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    ports:
      - "9292:9292"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 15s

  patient-db:
    <<: *postgres
    environment:
      POSTGRES_DB: patients
      POSTGRES_USER: ${POSTGRES_USER:-medirdv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medirdv}
    ports:
      - "5434:5432"
    volumes:
      - patient-db-data:/var/lib/postgresql/data

  scheduling-db:
    <<: *postgres
    environment:
      POSTGRES_DB: scheduling
      POSTGRES_USER: ${POSTGRES_USER:-medirdv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medirdv}
    ports:
      - "5435:5432"
    volumes:
      - scheduling-db-data:/var/lib/postgresql/data

  notification-db:
    <<: *postgres
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: ${POSTGRES_USER:-medirdv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medirdv}
    ports:
      - "5436:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:8280}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Extra public URL of the web app allowed as redirect URI / web origin (realm import placeholder).
      MEDIRDV_PUBLIC_URL: ${MEDIRDV_PUBLIC_URL:-http://localhost:8204}
      JAVA_OPTS_KC_HEAP: -Xmx512m
    ports:
      - "8280:8080"
    volumes:
      - ./deploy/keycloak/medirdv-realm.json:/opt/keycloak/data/import/medirdv-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  patient-service:
    build:
      context: .
      args:
        MODULE: patient-service
    image: medirdv/patient-service:local
    restart: unless-stopped
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://patient-db:5432/patients
      SPRING_PROFILES_ACTIVE: demo
    ports:
      - "8201:8201"
    depends_on:
      patient-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    mem_limit: 640m
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:9201/actuator/health/readiness | grep -q UP"]

  scheduling-service:
    build:
      context: .
      args:
        MODULE: scheduling-service
    image: medirdv/scheduling-service:local
    restart: unless-stopped
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://scheduling-db:5432/scheduling
      SPRING_PROFILES_ACTIVE: demo
    ports:
      - "8202:8202"
    depends_on:
      scheduling-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    mem_limit: 640m
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:9202/actuator/health/readiness | grep -q UP"]

  notification-service:
    build:
      context: .
      args:
        MODULE: notification-service
    image: medirdv/notification-service:local
    restart: unless-stopped
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://notification-db:5432/notifications
    ports:
      - "8203:8203"
    depends_on:
      notification-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    mem_limit: 640m
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:9203/actuator/health/readiness | grep -q UP"]

  gateway:
    build:
      context: .
      args:
        MODULE: gateway
    image: medirdv/gateway:local
    restart: unless-stopped
    environment:
      JWT_ISSUER_URI: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:8280}/realms/medirdv
      JWT_JWK_SET_URI: http://keycloak:8080/realms/medirdv/protocol/openid-connect/certs
      PATIENT_SERVICE_URL: http://patient-service:8201
      SCHEDULING_SERVICE_URL: http://scheduling-service:8202
      NOTIFICATION_SERVICE_URL: http://notification-service:8203
      CORS_ALLOWED_ORIGINS: http://localhost:4202,http://localhost:8204
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
    ports:
      - "8200:8200"
    mem_limit: 512m
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:9200/actuator/health/readiness | grep -q UP"]

  web:
    build:
      context: ./web
    image: medirdv/web:local
    restart: unless-stopped
    environment:
      # Written to /config.json at container start (see web/docker-entrypoint.d).
      KEYCLOAK_URL: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:8280}
      API_URL: /api
    ports:
      - "8204:8080"
    depends_on:
      - gateway

  # --- observability profile -------------------------------------------------
  tempo:
    image: grafana/tempo:2.8.2
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3201:3200"

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9290:9090"

  grafana:
    image: grafana/grafana:12.2.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3200:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  kafka-data:
  patient-db-data:
  scheduling-db-data:
  notification-db-data:
