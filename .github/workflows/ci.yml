name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ${{ matrix.service }} (mvn verify)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [scheduling-service, patient-service, notification-service, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests + Testcontainers integration tests (PostgreSQL 16, apache/kafka KRaft).
      - name: Build and test
        run: mvn -B -ntp -pl ${{ matrix.service }} -am verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: "**/target/surefire-reports"

  web:
    name: web (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Unit tests (headless Chrome)
        run: npm run test:ci
      - name: Production build
        run: npx ng build

  helm:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/medirdv
      - run: helm template medirdv deploy/helm/medirdv > /dev/null
      - run: helm template medirdv deploy/helm/medirdv --set demoData=true --set external.database.createSecret=true --set external.database.password=ci > /dev/null

  images:
    name: image ${{ matrix.image }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, web, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: gateway, context: ., module: gateway }
          - { image: patient-service, context: ., module: patient-service }
          - { image: scheduling-service, context: ., module: scheduling-service }
          - { image: notification-service, context: ., module: notification-service }
          - { image: web, context: web, module: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        run: |
          echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/medirdv-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          # The Helm chart defaults image.tag to its appVersion.
          echo "version=$(awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}' deploy/helm/medirdv/Chart.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: MODULE=${{ matrix.module }}
          push: true
          tags: |
            ${{ steps.name.outputs.repo }}:${{ github.sha }}
            ${{ steps.name.outputs.repo }}:${{ steps.name.outputs.version }}
            ${{ steps.name.outputs.repo }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
