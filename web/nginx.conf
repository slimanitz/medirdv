server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Docker DNS: resolve the gateway lazily so nginx starts even if the gateway is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8200;

    # Runtime configuration written at container start by docker-entrypoint.d/40-medirdv-config.sh.
    location = /config.json {
        alias /tmp/medirdv-config.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # Same-origin API: the browser calls /api/..., nginx forwards to the gateway.
    location /api/ {
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed bundles can be cached forever.
    location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single page application.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
